<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .calculator {
      width: 400px;
      background-color: #333;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .display {
      width: 100%;
      padding: 20px;
      background-color: #444;
      color: #fff;
      text-align: right;
      font-size: 2em;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 10px;
    }
    .button {
      padding: 15px;
      font-size: 1.2em;
      color: #fff;
      background-color: #666;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #888;
    }
    .button.operation {
      background-color: #ff9500;
    }
    .button.operation:hover {
      background-color: #ffa41b;
    }
    .button.equal {
      background-color: #007aff;
      grid-column: span 2;
    }
    .button.equal:hover {
      background-color: #339aff;
    }
    .button.clear {
      background-color: #ff3b30;
    }
    .button.clear:hover {
      background-color: #ff5e57;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <!-- Scientific functions -->
      <button class="button" onclick="appendToDisplay('Math.sin(')">sin</button>
      <button class="button" onclick="appendToDisplay('Math.cos(')">cos</button>
      <button class="button" onclick="appendToDisplay('Math.tan(')">tan</button>
      <button class="button" onclick="appendToDisplay('Math.log(')">ln</button>
      <button class="button clear" onclick="clearDisplay()">C</button>

      <button class="button" onclick="appendToDisplay('Math.sqrt(')">√</button>
      <button class="button" onclick="appendToDisplay('(')">(</button>
      <button class="button" onclick="appendToDisplay(')')">)</button>
      <button class="button" onclick="appendToDisplay('**')">^</button>
      <button class="button" onclick="appendToDisplay('%')">%</button>

      <!-- Basic calculator numbers and operations -->
      <button class="button" onclick="appendToDisplay('7')">7</button>
      <button class="button" onclick="appendToDisplay('8')">8</button>
      <button class="button" onclick="appendToDisplay('9')">9</button>
      <button class="button operation" onclick="appendToDisplay('/')">÷</button>
      <button class="button operation" onclick="appendToDisplay('*')">×</button>

      <button class="button" onclick="appendToDisplay('4')">4</button>
      <button class="button" onclick="appendToDisplay('5')">5</button>
      <button class="button" onclick="appendToDisplay('6')">6</button>
      <button class="button operation" onclick="appendToDisplay('-')">-</button>
      <button class="button operation" onclick="appendToDisplay('+')">+</button>

      <button class="button" onclick="appendToDisplay('1')">1</button>
      <button class="button" onclick="appendToDisplay('2')">2</button>
      <button class="button" onclick="appendToDisplay('3')">3</button>
      <button class="button" onclick="appendToDisplay('.')">.</button>
      <button class="button" onclick="appendToDisplay('0')">0</button>

      <button class="button equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendToDisplay(value) {
      if (display.innerText === '0') {
        display.innerText = value;
      } else {
        display.innerText += value;
      }
    }

    function clearDisplay() {
      display.innerText = '0';
    }

    function calculate() {
      try {
        display.innerText = eval(display.innerText);
      } catch (error) {
        display.innerText = 'Error';
      }
    }
  </script>
</body>
</html>
